name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test, dry-run publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get package dependencies
        run: flutter pub get

      - name: Get example dependencies
        run: flutter pub get
        working-directory: example

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check lib/ coverage threshold
        shell: bash
        env:
          MIN_COVERAGE: 70
        run: |
          set -euo pipefail
          awk -F'[:,]' -v min="$MIN_COVERAGE" '
            /^SF:/ { inlib = ($2 ~ /^lib\//) }
            inlib && /^LF:/ { lf += $2 }
            inlib && /^LH:/ { lh += $2 }
            END {
              if (lf == 0) {
                print "::error::No lib/ lines found in coverage/lcov.info"
                exit 1
              }
              pct = lh * 100 / lf
              if (pct < min) {
                printf "::error::lib/ coverage %.2f%% is below threshold %s%%\n", pct, min
                exit 1
              }
              printf "lib/ coverage: %.2f%% (threshold %s%%)\n", pct, min
            }
          ' coverage/lcov.info

      - name: Dry-run publish
        run: dart pub publish --dry-run
